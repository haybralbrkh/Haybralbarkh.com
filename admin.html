<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم هايبر البركة</title>
<meta name="theme-color" content="#1fa045">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--green:#1fa045;--green-dark:#12702d;--orange:#f5a800;--bg:#f3f6f3;--card:#fff;--text:#1f2937;--muted:#6b7280;--red:#dc2626}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  button{font:inherit;cursor:pointer}
  .hidden{display:none!important}
  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .login form{background:#fff;border-radius:18px;padding:28px;width:min(380px,100%);box-shadow:0 10px 30px rgba(0,0,0,.12);display:grid;gap:12px;text-align:center}
  .login img{width:110px;height:110px;border-radius:22px;margin:auto}
  input,select,textarea{padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font:inherit;width:100%;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:transparent}
  .btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:700}
  .btn:hover{background:var(--green-dark)}
  .btn.alt{background:#e5e7eb;color:var(--text)}
  .btn.danger{background:var(--red)}
  .btn.small{padding:5px 12px;font-size:.85rem}
  .err{color:var(--red);font-size:.9rem;min-height:1.2em}
  /* layout */
  header{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
  .top{max-width:1100px;margin:auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
  .top img{width:44px;height:44px;border-radius:10px}
  .top h1{font-size:1.15rem;flex:1}
  .tabs{max-width:1100px;margin:auto;display:flex;gap:6px;padding:0 16px 8px;overflow:auto}
  .tab{background:#eef2ee;border:none;border-radius:999px;padding:7px 18px;font-weight:600;white-space:nowrap}
  .tab.active{background:var(--green);color:#fff}
  .tab .badge{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;margin-inline-start:4px}
  main{max-width:1100px;margin:auto;padding:20px 16px 60px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .stat small{color:var(--muted)}
  .stat b{display:block;font-size:1.6rem;color:var(--green-dark)}
  .panel{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:16px}
  .panel h2{font-size:1.15rem;margin-bottom:12px;color:var(--green-dark)}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
  .form label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:3px}
  .form .full{grid-column:1/-1}
  .preview{width:90px;height:90px;object-fit:contain;border:1px dashed #cbd5e1;border-radius:10px;background:#fafafa}
  .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .pcard{border:1px solid #e5e7eb;border-radius:12px;padding:10px;display:grid;gap:4px;text-align:center}
  .pcard img{height:90px;object-fit:contain;margin:auto;max-width:100%}
  .pcard .ph{font-size:2.4rem;height:90px;display:flex;align-items:center;justify-content:center}
  .pcard .acts{display:flex;gap:6px;justify-content:center;margin-top:4px}
  .tag{display:inline-block;background:#e8f5ec;color:var(--green-dark);border-radius:999px;padding:0 10px;font-size:.78rem}
  .tag.off{background:#fee2e2;color:var(--red)}
  .order{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:10px;display:grid;gap:6px}
  .order.new{border-color:var(--orange);background:#fffbeb}
  .order .row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
  .order ul{padding-inline-start:20px;font-size:.92rem}
  .st{font-size:.8rem;border-radius:999px;padding:1px 12px;font-weight:700}
  .st.new{background:#fde68a}.st.preparing{background:#bfdbfe}.st.delivered{background:#bbf7d0}.st.cancelled{background:#fecaca}
  .empty{text-align:center;color:var(--muted);padding:24px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 22px;border-radius:999px;z-index:200;display:none}
</style>
</head>
<body>

<!-- تسجيل الدخول -->
<div class="login" id="loginView">
  <form id="loginForm">
    <img src="logo.png" alt="هايبر البركة">
    <h2>لوحة تحكم هايبر البركة</h2>
    <input id="email" type="email" placeholder="البريد الإلكتروني" required autocomplete="username">
    <input id="password" type="password" placeholder="كلمة المرور" required autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn" type="submit">دخول</button>
  </form>
</div>

<!-- اللوحة -->
<div id="appView" class="hidden">
  <header>
    <div class="top">
      <img src="logo.png" alt="">
      <h1>لوحة التحكم</h1>
      <a href="index.html" target="_blank" class="btn alt small" style="text-decoration:none">عرض الموقع</a>
      <button class="btn danger small" id="logout">خروج</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-t="dash">الرئيسية</button>
      <button class="tab" data-t="orders">الطلبات <span class="badge hidden" id="newBadge">0</span></button>
      <button class="tab" data-t="products">المنتجات</button>
    </div>
  </header>

  <main>
    <!-- الرئيسية -->
    <section id="t-dash">
      <div class="stats">
        <div class="stat"><small>عدد المنتجات</small><b id="sProducts">0</b></div>
        <div class="stat"><small>طلبات جديدة</small><b id="sNew">0</b></div>
        <div class="stat"><small>طلبات اليوم</small><b id="sToday">0</b></div>
        <div class="stat"><small>مبيعات اليوم (المُسلَّمة)</small><b id="sSales">0</b></div>
      </div>
      <div class="panel"><h2>آخر الطلبات</h2><div id="recent"></div></div>
    </section>

    <!-- الطلبات -->
    <section id="t-orders" class="hidden">
      <div class="panel">
        <div class="form" style="margin-bottom:12px">
          <div><label>تصفية بالحالة</label>
            <select id="orderFilter">
              <option value="all">كل الطلبات</option>
              <option value="new">جديد</option>
              <option value="preparing">قيد التجهيز</option>
              <option value="delivered">تم التسليم</option>
              <option value="cancelled">ملغي</option>
            </select></div>
        </div>
        <div id="orders"></div>
      </div>
    </section>

    <!-- المنتجات -->
    <section id="t-products" class="hidden">
      <div class="panel">
        <h2 id="formTitle">إضافة منتج</h2>
        <form class="form" id="pForm">
          <div><label>اسم المنتج *</label><input id="pName" required></div>
          <div><label>السعر (ج.م) *</label><input id="pPrice" type="number" step="0.01" min="0" required></div>
          <div><label>السعر قبل الخصم (اختياري)</label><input id="pOld" type="number" step="0.01" min="0"></div>
          <div><label>القسم</label><input id="pCat" list="catList" placeholder="مثال: بقالة"><datalist id="catList"></datalist></div>
          <div><label>الحالة</label>
            <select id="pAvail"><option value="1">متاح</option><option value="0">غير متاح (مخفي)</option></select></div>
          <div><label>صورة المنتج</label><input id="pFile" type="file" accept="image/*"></div>
          <div class="full" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <img class="preview hidden" id="pPrev" alt="">
            <button class="btn" id="pSave" type="submit">حفظ المنتج</button>
            <button class="btn alt hidden" id="pCancel" type="button">إلغاء التعديل</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>المنتجات الحالية</h2>
        <input id="pSearch" placeholder="ابحث في المنتجات..." style="margin-bottom:12px">
        <div class="plist" id="plist"></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyCAGNcDQnU93Yf85NpwijgIKJEJZMoyZUM",
    authDomain: "haybar-f088e.firebaseapp.com",
    projectId: "haybar-f088e",
    storageBucket: "haybar-f088e.firebasestorage.app",
    messagingSenderId: "848725586091",
    appId: "1:848725586091:web:1377d3167540062c7d87ee",
    measurementId: "G-Y59JYC9HBX"
  });
  const auth = getAuth(app), db = getFirestore(app);

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const money = n => Number(n||0).toLocaleString("ar-EG") + " ج.م";
  const toast = m => { const t=$("toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none",2500); };
  const STATUS = {new:"جديد",preparing:"قيد التجهيز",delivered:"تم التسليم",cancelled:"ملغي"};

  let products = [], orders = [], editingId = null, imageData = null, unsubs = [];

  /* ---------- الدخول ---------- */
  $("loginForm").addEventListener("submit", async e=>{
    e.preventDefault(); $("loginErr").textContent="";
    try{ await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value); }
    catch(err){ $("loginErr").textContent="البريد أو كلمة المرور غير صحيحة"; }
  });
  $("logout").onclick = () => signOut(auth);

  onAuthStateChanged(auth, user=>{
    unsubs.forEach(u=>u()); unsubs=[];
    $("loginView").classList.toggle("hidden",!!user);
    $("appView").classList.toggle("hidden",!user);
    if(!user) return;
    unsubs.push(onSnapshot(collection(db,"products"), s=>{
      products = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ar"));
      renderProducts(); renderStats();
    }, e=>toast("تعذر تحميل المنتجات - راجع قواعد Firestore")));
    unsubs.push(onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc")), s=>{
      orders = s.docs.map(d=>({id:d.id,...d.data()}));
      renderOrders(); renderStats();
    }, e=>toast("تعذر تحميل الطلبات - راجع قواعد Firestore")));
  });

  /* ---------- التبويبات ---------- */
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
    ["dash","orders","products"].forEach(t=>$("t-"+t).classList.toggle("hidden",t!==b.dataset.t));
  });

  /* ---------- الإحصائيات ---------- */
  const isToday = ts => { if(!ts?.toDate) return false; const d=ts.toDate(), n=new Date(); return d.toDateString()===n.toDateString(); };
  function renderStats(){
    const nw = orders.filter(o=>o.status==="new").length;
    $("sProducts").textContent = products.length;
    $("sNew").textContent = nw;
    $("newBadge").textContent = nw; $("newBadge").classList.toggle("hidden",!nw);
    const today = orders.filter(o=>isToday(o.createdAt));
    $("sToday").textContent = today.length;
    $("sSales").textContent = money(today.filter(o=>o.status==="delivered").reduce((s,o)=>s+(+o.total||0),0));
    $("recent").innerHTML = orders.slice(0,5).map(orderHtml).join("") || `<div class="empty">لا توجد طلبات بعد</div>`;
    bindOrderActions($("recent"));
  }

  /* ---------- الطلبات ---------- */
  function orderHtml(o){
    const when = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString("ar-EG") : "";
    return `<div class="order ${o.status==="new"?"new":""}">
      <div class="row"><b>${esc(o.name)}</b><span class="st ${esc(o.status)}">${STATUS[o.status]||esc(o.status)}</span></div>
      <div class="row"><a href="tel:${esc(o.phone)}">📞 ${esc(o.phone)}</a><small>${when}</small></div>
      <div>📍 ${esc(o.address)}</div>
      <ul>${(o.items||[]).map(i=>`<li>${esc(i.name)} × ${i.qty} — ${money(i.price*i.qty)}</li>`).join("")}</ul>
      <div class="row"><b>الإجمالي: ${money(o.total)}</b>
        <span style="display:flex;gap:6px;flex-wrap:wrap">
          <select data-os="${esc(o.id)}" style="width:auto">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${o.status===k?"selected":""}>${v}</option>`).join("")}</select>
          <button class="btn danger small" data-od="${esc(o.id)}">حذف</button>
        </span></div>
    </div>`;
  }
  function bindOrderActions(root){
    root.querySelectorAll("[data-os]").forEach(s=>s.onchange=async()=>{
      try{ await updateDoc(doc(db,"orders",s.dataset.os),{status:s.value}); toast("تم تحديث الحالة"); }catch{ toast("فشل التحديث"); }
    });
    root.querySelectorAll("[data-od]").forEach(b=>b.onclick=async()=>{
      if(!confirm("حذف الطلب نهائياً؟")) return;
      try{ await deleteDoc(doc(db,"orders",b.dataset.od)); toast("تم الحذف"); }catch{ toast("فشل الحذف"); }
    });
  }
  function renderOrders(){
    const f=$("orderFilter").value;
    const list = orders.filter(o=>f==="all"||o.status===f);
    $("orders").innerHTML = list.map(orderHtml).join("") || `<div class="empty">لا توجد طلبات</div>`;
    bindOrderActions($("orders"));
  }
  $("orderFilter").onchange = renderOrders;

  /* ---------- المنتجات ---------- */
  function renderProducts(){
    const q = $("pSearch").value.trim();
    $("catList").innerHTML = [...new Set(products.map(p=>p.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
    const list = products.filter(p=>(p.name||"").includes(q));
    $("plist").innerHTML = list.map(p=>`<div class="pcard">
      ${p.image?`<img src="${esc(p.image)}" alt="">`:`<div class="ph">🛍️</div>`}
      <b>${esc(p.name)}</b>
      <div>${money(p.price)} ${p.old?`<s style="color:#9ca3af">${money(p.old)}</s>`:""}</div>
      <div>${p.category?`<span class="tag">${esc(p.category)}</span>`:""} <span class="tag ${p.available===false?"off":""}">${p.available===false?"مخفي":"متاح"}</span></div>
      <div class="acts"><button class="btn small" data-pe="${esc(p.id)}">تعديل</button><button class="btn danger small" data-pd="${esc(p.id)}">حذف</button></div>
    </div>`).join("") || `<div class="empty" style="grid-column:1/-1">لا توجد منتجات، أضف أول منتج من النموذج بالأعلى</div>`;
    $("plist").querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>editProduct(b.dataset.pe));
    $("plist").querySelectorAll("[data-pd]").forEach(b=>b.onclick=async()=>{
      if(!confirm("حذف المنتج نهائياً؟")) return;
      try{ await deleteDoc(doc(db,"products",b.dataset.pd)); toast("تم حذف المنتج"); }catch{ toast("فشل الحذف"); }
    });
  }
  $("pSearch").oninput = renderProducts;

  // تصغير الصورة قبل الحفظ عشان حجمها يبقى صغير
  function shrink(file, max=480){
    return new Promise((res,rej)=>{
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = ()=>{
        const r = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg",0.82));
      };
      img.onerror = rej; img.src = url;
    });
  }
  $("pFile").onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{ imageData = await shrink(f); $("pPrev").src = imageData; $("pPrev").classList.remove("hidden"); }
    catch{ toast("تعذر قراءة الصورة"); }
  };

  function resetForm(){
    editingId=null; imageData=null;
    $("pForm").reset(); $("pPrev").classList.add("hidden"); $("pPrev").removeAttribute("src");
    $("formTitle").textContent="إضافة منتج"; $("pCancel").classList.add("hidden");
  }
  function editProduct(id){
    const p = products.find(x=>x.id===id); if(!p) return;
    editingId=id; imageData=p.image||null;
    $("pName").value=p.name||""; $("pPrice").value=p.price??""; $("pOld").value=p.old??"";
    $("pCat").value=p.category||""; $("pAvail").value=p.available===false?"0":"1";
    if(p.image){ $("pPrev").src=p.image; $("pPrev").classList.remove("hidden"); } else $("pPrev").classList.add("hidden");
    $("formTitle").textContent="تعديل المنتج"; $("pCancel").classList.remove("hidden");
    $("pForm").scrollIntoView({behavior:"smooth",block:"center"});
  }
  $("pCancel").onclick = resetForm;

  $("pForm").addEventListener("submit", async e=>{
    e.preventDefault();
    $("pSave").disabled = true;
    const data = {
      name: $("pName").value.trim(),
      price: +$("pPrice").value,
      old: $("pOld").value ? +$("pOld").value : null,
      category: $("pCat").value.trim(),
      available: $("pAvail").value==="1",
      image: imageData || "",
      updatedAt: serverTimestamp()
    };
    try{
      if(editingId) await setDoc(doc(db,"products",editingId), data, {merge:true});
      else await addDoc(collection(db,"products"), {...data, createdAt: serverTimestamp()});
      toast(editingId?"تم تحديث المنتج ✔":"تمت إضافة المنتج ✔");
      resetForm();
    }catch(err){ console.error(err); toast("فشل الحفظ - تأكد من صلاحيات Firestore"); }
    $("pSave").disabled = false;
  });
</script>
</body>
</html>
