<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هايبر البركة | أفضل الأسعار وأجود المنتجات</title>
<meta name="theme-color" content="#16a34a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316a34a'/%3E%3Ctext x='50' y='60' font-size='20' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E%D9%87%D8%A7%D9%8A%D8%A8%D8%B1 %D8%A7%D9%84%D8%A8%D8%B1%D9%83%D8%A9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --g1:#16a34a; --g2:#15803d; --bg:#f4f7f5; --card:#fff; --tx:#1b2a22; --mu:#6b7a72; --bd:#e4ebe6; --red:#dc2626; --sh:0 4px 12px rgba(0,0,0,.05); }
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--tx);line-height:1.6}
button{cursor:pointer;border:none;background:none;font:inherit}
[hidden]{display:none!important}
img{max-width:100%}
/* Header */
.top{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;color:var(--g2);text-decoration:none}
.brand img{width:40px;height:40px;border-radius:10px}
.actions{display:flex;gap:8px;align-items:center}
.btn{background:var(--g1);color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--g2)}
.btn.or{background:#f5a800;color:#222}
.btn.red{background:var(--red);color:#fff}
.btn.gh{background:#eef3ef;color:var(--tx)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.inp{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;font-family:inherit}
/* Products */
main{padding:20px 14px 80px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:var(--sh);text-align:center;display:flex;flex-direction:column;gap:8px}
.card .pic{height:120px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:#f9fbf9;border-radius:8px}
.card .pic img{max-height:100%;object-fit:contain}
.card .name{font-weight:700;font-size:.95rem;flex:1}
.card .price{color:var(--g2);font-weight:800;font-size:1.1rem}
/* Modals */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none}
.backdrop.on{display:block}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:#fff;padding:20px;border-radius:16px;z-index:100;width:90%;max-width:400px;opacity:0;pointer-events:none;transition:.3s}
.modal.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.modal h3{margin-bottom:15px;color:var(--g2);text-align:center}
/* Admin */
.admin-header{background:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40}
.tabs{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd)}
.tab{padding:8px 16px;border-radius:20px;background:#eef3ef;font-weight:700;white-space:nowrap}
.tab.on{background:var(--g1);color:#fff}
.admin-main{padding:20px 14px;max-width:1000px;margin:auto}
.panel{background:#fff;padding:16px;border-radius:12px;box-shadow:var(--sh);margin-bottom:16px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.pcard{border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}
.pcard img{height:60px;object-fit:contain}
.order-card{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:20px;z-index:1000;opacity:0;transition:.3s}
#toast.on{opacity:1}
</style>
</head>
<body>

<!-- ============ المتجر ============ -->
<div id="shop">
  <header class="top">
    <a href="#" class="brand" id="brandLogo">
      <img data-logo alt="البركة"> هايبر البركة
    </a>
    <div class="actions">
      <button class="btn or" id="installBtn" hidden>تثبيت</button>
      <button class="btn" id="loginBtn">دخول</button>
      <button class="btn gh" id="cartBtn">🛒 (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <main id="products">
    <div class="grid" id="list"></div>
  </main>
</div>

<!-- ============ لوحة التحكم ============ -->
<div id="admin" hidden>
  <div class="admin-header">
    <h2>لوحة التحكم</h2>
    <div>
      <a href="#" class="btn gh sm" id="toShop">المتجر</a>
      <button class="btn red sm" id="logoutBtn">خروج</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="products">المنتجات</button>
    <button class="tab" data-t="orders">الطلبات</button>
  </div>
  
  <div class="admin-main">
    <div id="t-products">
      <div class="panel">
        <h3>إضافة منتج جديد</h3>
        <input class="inp" id="pName" placeholder="اسم المنتج" required>
        <input class="inp" id="pPrice" type="number" placeholder="السعر" required>
        <input type="file" id="pFile" accept="image/*" class="inp">
        <button class="btn full" id="saveProductBtn">حفظ المنتج</button>
      </div>
      <div class="panel">
        <h3>المنتجات الحالية</h3>
        <div class="plist" id="plist"></div>
      </div>
    </div>

    <div id="t-orders" hidden>
      <div class="panel">
        <h3>الطلبات</h3>
        <div id="ordersList"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ النوافذ ============ -->
<div class="backdrop" id="backdrop"></div>

<div class="modal" id="loginModal">
  <h3>تسجيل الدخول</h3>
  <input class="inp" id="lPhone" type="tel" placeholder="رقم الهاتف">
  <input class="inp" id="lPass" type="password" placeholder="كلمة المرور">
  <button class="btn full" id="doLoginBtn">دخول</button>
  <button class="btn gh full mt-2" id="closeLogin">إغلاق</button>
</div>

<div class="modal" id="cartModal">
  <h3>سلة المشتريات</h3>
  <div id="cartItems" style="margin-bottom:15px; max-height:200px; overflow-y:auto;"></div>
  <input class="inp" id="cName" placeholder="الاسم">
  <input class="inp" id="cPhone" type="tel" placeholder="رقم الهاتف">
  <input class="inp" id="cAddr" placeholder="العنوان">
  <button class="btn full" id="sendOrderBtn">تأكيد الطلب</button>
  <button class="btn gh full mt-2" id="closeCart">إغلاق</button>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCAGNcDQnU93Yf85NpwijgIKJEJZMoyZUM",
  authDomain: "haybar-f088e.firebaseapp.com",
  projectId: "haybar-f088e",
  storageBucket: "haybar-f088e.firebasestorage.app",
  messagingSenderId: "848725586091",
  appId: "1:848725586091:web:1377d3167540062c7d87ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ADMIN_EMAIL = "01123543649@baraka.app";
const EMAIL_DOMAIN = "@baraka.app";
const LOGO = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316a34a'/%3E%3Ctext x='50' y='60' font-size='20' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E%D9%87%D8%A7%D9%8A%D8%A8%D8%B1 %D8%A7%D9%84%D8%A8%D8%B1%D9%83%D8%A9%3C/text%3E%3C/svg%3E";

document.querySelectorAll("img[data-logo]").forEach(el => el.src = LOGO);

const $ = id => document.getElementById(id);
let products = [], cart = JSON.parse(localStorage.getItem('cart') || '{}'), isAdmin = false, user = null;

// دالة لإظهار التنبيهات
const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2500); };

// إدارة النوافذ (تفتح وتغلق فورا)
function openModal(id) { $("backdrop").classList.add("on"); $(id).classList.add("open"); }
function closeModals() { $("backdrop").classList.remove("on"); document.querySelectorAll(".modal").forEach(m => m.classList.remove("open")); }
$("backdrop").onclick = closeModals;
$("closeLogin").onclick = $("closeCart").onclick = closeModals;

// جلب المنتجات فورا (بدون تعقيدات)
onSnapshot(collection(db, "products"), snap => {
  products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderProducts();
  if(isAdmin) renderAdminProducts();
}, err => {
  console.error(err);
  $("list").innerHTML = `<div style="text-align:center; padding:20px;">حدث خطأ في جلب المنتجات. تأكد من قواعد Firebase.</div>`;
});

function renderProducts() {
  if(!products.length) {
    $("list").innerHTML = `<div style="text-align:center; width:100%; padding:30px;">لا توجد منتجات حالياً</div>`;
    return;
  }
  $("list").innerHTML = products.map(p => `
    <div class="card">
      <div class="pic">${p.image ? `<img src="${p.image}">` : "🛍️"}</div>
      <div class="name">${p.name}</div>
      <div class="price">${p.price} ج.م</div>
      <button class="btn" onclick="addToCart('${p.id}', '${p.name}', ${p.price})">أضف للسلة</button>
    </div>
  `).join("");
}

// السلة والطلب
window.addToCart = (id, name, price) => {
  cart[id] = cart[id] || { name, price, qty: 0 };
  cart[id].qty++;
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartUI();
  toast("تمت الإضافة للسلة");
};

function updateCartUI() {
  let count = 0;
  for(let id in cart) count += cart[id].qty;
  $("cartCount").textContent = count;
  
  let html = "";
  for(let id in cart) {
    html += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; border-bottom:1px solid #eee; padding-bottom:5px;">
      <span>${cart[id].name} (x${cart[id].qty})</span>
      <b>${cart[id].price * cart[id].qty} ج.م</b>
    </div>`;
  }
  $("cartItems").innerHTML = html || "السلة فارغة";
}
$("cartBtn").onclick = () => { updateCartUI(); openModal("cartModal"); };

$("sendOrderBtn").onclick = async () => {
  if(!user) return toast("يجب تسجيل الدخول أولاً");
  const items = Object.values(cart);
  if(!items.length) return toast("السلة فارغة");
  
  $("sendOrderBtn").disabled = true;
  try {
    await addDoc(collection(db, "orders"), {
      uid: user.uid, name: $("cName").value, phone: $("cPhone").value, address: $("cAddr").value,
      items: items, total: items.reduce((s,i) => s + i.price*i.qty, 0), status: "new", createdAt: serverTimestamp()
    });
    cart = {}; localStorage.removeItem('cart');
    updateCartUI(); closeModals(); toast("تم إرسال الطلب بنجاح!");
  } catch(e) {
    toast("خطأ في إرسال الطلب");
  }
  $("sendOrderBtn").disabled = false;
};

// تسجيل الدخول
$("loginBtn").onclick = () => openModal("loginModal");
$("doLoginBtn").onclick = async () => {
  const phone = $("lPhone").value.trim(), pass = $("lPass").value;
  if(phone.length < 11 || pass.length < 6) return toast("بيانات غير صحيحة");
  $("doLoginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, phone + EMAIL_DOMAIN, pass);
    toast("تم الدخول بنجاح");
  } catch(e) {
    toast("بيانات الدخول خاطئة");
  }
  $("doLoginBtn").disabled = false;
};

// مراقبة حالة المستخدم (تحديث فوري بدون تحديث الصفحة)
onAuthStateChanged(auth, u => {
  user = u;
  if(u) {
    isAdmin = u.email === ADMIN_EMAIL;
    $("loginBtn").style.display = "none";
    closeModals();
    if(isAdmin) {
      $("shop").hidden = true; $("admin").hidden = false;
    }
  } else {
    isAdmin = false;
    $("loginBtn").style.display = "flex";
    $("shop").hidden = false; $("admin").hidden = true;
  }
});

// التنقل للوحة التحكم
$("toShop").onclick = (e) => { e.preventDefault(); $("shop").hidden = false; $("admin").hidden = true; };
$("logoutBtn").onclick = () => signOut(auth);

// لوحة التحكم (المنتجات)
let imageData = null;
$("pFile").onchange = (e) => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const c = document.createElement("canvas");
    const r = Math.min(1, 400 / Math.max(img.width, img.height));
    c.width = img.width * r; c.height = img.height * r;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    imageData = c.toDataURL("image/jpeg", 0.7);
    toast("تم تجهيز الصورة");
  };
  img.src = url;
};

$("saveProductBtn").onclick = async () => {
  const name = $("pName").value, price = $("pPrice").value;
  if(!name || !price) return toast("أدخل الاسم والسعر");
  $("saveProductBtn").disabled = true;
  try {
    await addDoc(collection(db, "products"), { name, price: +price, image: imageData || "", createdAt: serverTimestamp() });
    toast("تم حفظ المنتج ✔");
    $("pName").value = ""; $("pPrice").value = ""; imageData = null;
  } catch(e) { toast("فشل الحفظ - تأكد من قواعد Firebase"); }
  $("saveProductBtn").disabled = false;
};

function renderAdminProducts() {
  $("plist").innerHTML = products.map(p => `
    <div class="pcard">
      ${p.image ? `<img src="${p.image}">` : "🛍️"}
      <b>${p.name}</b>
      <span>${p.price} ج.م</span>
      <button class="btn red sm" onclick="delProduct('${p.id}')">حذف</button>
    </div>
  `).join("");
}
window.delProduct = async (id) => {
  if(confirm("حذف المنتج؟")) {
    await deleteDoc(doc(db, "products", id));
  }
};

// لوحة التحكم (الطلبات)
onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), snap => {
  if(!isAdmin) return;
  const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  $("ordersList").innerHTML = orders.map(o => `
    <div class="order-card">
      <div>
        <b>${o.name}</b> - ${o.total} ج.م<br>
        <small>${o.phone}</small>
      </div>
    </div>
  `).join("") || "لا توجد طلبات";
});

// التنقل بين تبويبات لوحة التحكم
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  $("t-products").hidden = t.dataset.t !== "products";
  $("t-orders").hidden = t.dataset.t !== "orders";
});
</script>
</body>
</html>
